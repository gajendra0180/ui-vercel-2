steps:
  # Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']

  # Build the frontend
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    env:
      - 'VITE_API_BASE_URL=https://apix-backend-951726146933.us-central1.run.app'

  # Deploy to Firebase Hosting
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting --project trim-dahlia-485008-u2

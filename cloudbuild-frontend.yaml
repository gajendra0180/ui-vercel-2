# Cloud Build configuration for APIX Frontend
# Builds and deploys to Firebase Hosting

steps:
  # Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['install']

  # Build for production
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    env:
      - 'VITE_API_BASE_URL=${_API_BASE_URL}'

  # Deploy to Firebase Hosting
  - name: 'gcr.io/firebase-admin/firebase'
    args:
      - 'deploy'
      - '--only'
      - 'hosting'
      - '--project'
      - '$PROJECT_ID'

substitutions:
  _API_BASE_URL: 'https://apix-backend-xxxxx-uc.a.run.app'

options:
  logging: CLOUD_LOGGING_ONLY
